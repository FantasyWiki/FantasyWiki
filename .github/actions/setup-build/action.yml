name: Set up the build
description: >-
  The JDK, and every cache the Gradle build would otherwise re-download on each
  run. Checkout stays the caller's job, because only the caller knows what it
  needs checked out.

runs:
  using: composite
  steps:
    # Pinned rather than taken from whatever the runner image ships, which is
    # the same JDK `publish-images.yml` builds the collector with.
    - name: Set up the JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    # Caches `~/.gradle`: the wrapper's own distribution — a 60-second download
    # on a cold runner — plus the collector's Kotlin dependencies.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    # What `setup-gradle` does *not* cover. The node plugin is configured with
    # `download = true`, and it puts the distribution under the **project's**
    # `.gradle/nodejs`, not the Gradle user home, so it misses that cache
    # entirely and is re-downloaded once per project per run.
    #
    # `~/.npm` is the other half: three `npm ci` runs populate it, and it is
    # keyed on the lockfiles so a dependency bump invalidates it and nothing
    # else does.
    - name: Cache Node and the npm store
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          .gradle/nodejs
          frontend/.gradle/nodejs
          backend/.gradle/nodejs
        key: node-${{ runner.os }}-${{ hashFiles('package.json', '**/package-lock.json') }}
        restore-keys: |
          node-${{ runner.os }}-
