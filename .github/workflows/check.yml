name: Check
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - name: Determine dry-run flag
        id: check_branch
        shell: bash
        run: |
          ruby << 'RUBY' >> $GITHUB_OUTPUT
            branch = ENV['GITHUB_REF'].sub(/^refs\/heads\//, '')
            keywords = %w[gradle kotlin publish release deploy]
            dry = keywords.any? { |kw| branch.include?(kw) } ? '' : '--dry-run'
            puts "dry_run=#{dry}"
          RUBY
      # The backend suite runs against both persistence targets
      # (docs/architecture/persistence-targets.md). It starts a MongoDB replica
      # set of its own when `MONGO_URL` is unset, which is what makes a local
      # `./gradlew check` need nothing installed — but on a runner that means
      # downloading a ~220MB `mongod` on every build, so CI hands it a container
      # instead. A single node is enough; a replica set is required because the
      # guarded writes are transactions.
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate()'
      - name: Check
        run: ./gradlew check
        env:
          MONGO_URL: mongodb://127.0.0.1:27017/fantasywiki_test?directConnection=true

      # `check` already depends on koverXmlReport, so this costs nothing but the
      # upload. The documentation build reads it to draw the collector's bar.
      - name: Publish the collector's coverage for the docs build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scoring-collector
          path: scoring-collector/build/reports/kover/report.xml
          if-no-files-found: warn
          retention-days: 7

  success:
    runs-on: ubuntu-24.04
    needs:
      - check
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
