name: Check
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.31
      - name: Determine dry-run flag
        id: check_branch
        shell: bash
        run: |
          ruby << 'RUBY' >> $GITHUB_OUTPUT
            branch = ENV['GITHUB_REF'].sub(/^refs\/heads\//, '')
            keywords = %w[gradle kotlin publish release deploy]
            dry = keywords.any? { |kw| branch.include?(kw) } ? '' : '--dry-run'
            puts "dry_run=#{dry}"
          RUBY
      - name: Check
        run: ./gradlew check

      # `check` already depends on koverXmlReport, so this costs nothing but the
      # upload. The documentation build reads it to draw the collector's bar.
      - name: Publish the collector's coverage for the docs build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-scoring-collector
          path: scoring-collector/build/reports/kover/report.xml
          if-no-files-found: warn
          retention-days: 7

  success:
    runs-on: ubuntu-24.04
    needs:
      - check
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
