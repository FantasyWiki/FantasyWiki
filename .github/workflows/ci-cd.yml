name: ci-cd
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  dispatcher:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
      || startsWith(github.head_ref, 'dependabot/')
    outputs:
      docs: ${{ steps.touched.outputs.docs }}
      frontend: ${{ steps.touched.outputs.frontend }}
      backend: ${{ steps.touched.outputs.backend }}
      collector: ${{ steps.touched.outputs.collector }}
    steps:
      - run: 'true'

      # Which parts of the repository this change can possibly have broken.
      #
      # Answered through the compare API rather than a checkout plus a
      # path-filter action: the dispatcher already runs on every push, and this
      # adds a couple of seconds to it instead of a whole extra job.
      #
      # Every uncertainty resolves to *running* the work. A first push, a manual
      # run, a failed compare, a change to the build itself or to CI, and both
      # branches that deploy — all of them run everything. A filter that wrongly
      # skips ships a break behind a green check, which is strictly worse than a
      # slow build; a filter that wrongly runs costs two minutes.
      - name: What did this touch?
        id: touched
        env:
          GH_TOKEN: ${{ github.token }}
          # A push compares against what the branch was; a pull request compares
          # against the branch it targets, otherwise `github.event.before` is
          # empty on every pull request and nothing is ever filtered.
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -uo pipefail

          run_all() {
            {
              echo "docs=true"
              echo "frontend=true"
              echo "backend=true"
              echo "collector=true"
            } >> "$GITHUB_OUTPUT"
            echo "Running everything: $1"
            exit 0
          }

          # `master` and `dev` deploy, and `master` republishes the documentation
          # site, whose coverage board is drawn from the reports these jobs
          # upload. A filtered run there would publish a board with holes in it.
          case "${GITHUB_REF_NAME}" in
            master|dev) run_all "${GITHUB_REF_NAME} deploys." ;;
          esac

          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            run_all "no comparable base."
          fi

          files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
            --jq '.files[].filename' 2>/dev/null) || run_all "the compare failed."

          # Anything that changes how everything is built, tested or shipped.
          if grep -qE '^(package\.json|package-lock\.json|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|gradle/|\.github/(workflows|actions)/)' <<< "$files"; then
            run_all "the build or CI itself changed."
          fi

          # `model/` and `dto/` are packages both Node subprojects compile
          # against, so a change to either is a change to both. Getting this
          # wrong is the one way this filter can ship a broken frontend behind a
          # green check — see docs/architecture/backend-architecture.md.
          frontend=false
          backend=false
          collector=false

          if grep -qE '^(model/|dto/)' <<< "$files"; then
            frontend=true
            backend=true
          fi
          grep -qE '^frontend/' <<< "$files" && frontend=true
          grep -qE '^backend/' <<< "$files" && backend=true
          grep -qE '^(scoring-collector/|docker/)' <<< "$files" && collector=true

          # `docs/**` covers the site itself now that it lives at `docs/site`.
          # `backend/openapi.yaml` is the one documentation file that lives
          # outside `docs/`, next to the Worker it describes — the API reference
          # is rendered from it, so a change to it has to republish the site.
          docs=false
          if grep -qE '^(docs/|backend/openapi\.yaml|CONTEXT\.md|PRODUCT\.md|DESIGN\.md|AGENTS\.md|CLAUDE\.md)' <<< "$files"; then
            docs=true
          fi

          {
            echo "docs=${docs}"
            echo "frontend=${frontend}"
            echo "backend=${backend}"
            echo "collector=${collector}"
          } >> "$GITHUB_OUTPUT"
          echo "docs=${docs} frontend=${frontend} backend=${backend} collector=${collector}"

  ci-cd:
    needs:
      - dispatcher
    uses: ./.github/workflows/check.yml
    with:
      frontend: ${{ needs.dispatcher.outputs.frontend == 'true' }}
      backend: ${{ needs.dispatcher.outputs.backend == 'true' }}
      collector: ${{ needs.dispatcher.outputs.collector == 'true' }}
    permissions:
      contents: write
      packages: write

  # After `ci-cd` rather than beside it: the report it uploads is a by-product of
  # that run, which is what stops the suites being executed a second time here.
  # Skipped with the backend job, because there is then no report to hand over.
  coverage:
    needs:
      - dispatcher
      - ci-cd
    if: needs.dispatcher.outputs.backend == 'true'
    uses: ./.github/workflows/coverage.yml
    secrets: inherit
    permissions:
      contents: write

  deploy:
    needs:
      - ci-cd
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write

  # The technical documentation site. Behind the same gate as deploy, after
  # coverage because the board it draws is built from that job's artifacts, and
  # only when the push actually touched something the site is built from.
  docs:
    needs:
      - dispatcher
      - ci-cd
      - coverage
    if: >-
      ${{ always()
      && needs.ci-cd.result == 'success'
      && needs.coverage.result != 'failure'
      && needs.dispatcher.outputs.docs == 'true' }}
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # Container images to GHCR, for the services Cloudflare does not host. Behind
  # the same gate as deploy — an image is only worth publishing for a revision
  # that passed check.
  publish-images:
    needs:
      - ci-cd
    uses: ./.github/workflows/publish-images.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
