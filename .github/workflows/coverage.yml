name: Coverage

# This workflow used to re-run both test suites to measure them, which meant the
# frontend suite executed twice per push and the backend's D1 suite did too.
# `check.yml` now asks its own runs for a coverage report (`-Pcoverage`), so all
# that is left here is handing the result to Codecov.
#
# It stays a workflow of its own rather than a step in `check.yml` for one
# reason: it needs `CODECOV_TOKEN`, and `check.yml` must keep naming no secret,
# because that is the workflow a pull request from a fork is allowed to run.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  codecov:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Codecov reads the report against the sources it describes, so the
      # checkout is still needed even though nothing is built here.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect the backend's coverage
        id: collect
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: codecov-backend
          path: backend/coverage

      # A run whose backend job was filtered out has no report to upload, and
      # that is not a failure. Uploading nothing, on the other hand, would let
      # Codecov record an empty report as a coverage collapse.
      - name: Upload to Codecov
        if: steps.collect.outcome == 'success'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: backend/coverage
