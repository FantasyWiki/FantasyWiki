name: Nightly scoring

# Component 3 of the scoring engine (docs/architecture/scoring-pipeline.md): runs the
# Kotlin :scoring-collector nightly to fetch each contracted article's daily
# Wikimedia signals and POST them to the backend's /internal endpoints, which
# score and persist them.
#
# It runs the collector as the container image publish-images.yml pushes to
# GHCR, rather than building it from source here — so the nightly scores exactly
# the artefact that was published for master, and needs neither a checkout nor a
# JDK. `schedule:` only ever fires from the default branch anyway; the collector
# is not per-branch deployed the way the Worker is. It targets **production
# only**: the QA backend is not scored. The job is scoped to the `production` GitHub Environment so the ingest
# secret it reads is the production one. Manual runs can backfill a specific day
# via `date`.

on:
  schedule:
    # ~05:00 UTC — ~2h after AQS publishes the previous UTC day; GH cron jitter
    # (10–30 min) is absorbed by that buffer. Scores the last completed UTC day.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to score (YYYY-MM-DD); defaults to the last completed UTC day"
        required: false

permissions:
  contents: read

# Never let two runs score the same day at once; the ingest is idempotent, but
# overlapping runs waste Wikimedia rate budget.
concurrency:
  group: scoring-${{ github.event.inputs.date || 'nightly' }}
  cancel-in-progress: false

jobs:
  score:
    # Where this runs is a repository-variable decision, not a code one: set
    # SCORING_RUNNER=external when something else owns the nightly, unset it to
    # take it back. A manual dispatch always runs regardless — clicking Run is an
    # explicit instruction, and it is how you backfill a day mid-handover.
    #
    # An unrecognised value runs here, deliberately. The ingest upserts on
    # (teamId, date), so scoring twice costs only Wikimedia budget while scoring
    # neither costs a missing day — a typo should fail toward the cheap mistake.
    if: github.event_name == 'workflow_dispatch' || vars.SCORING_RUNNER != 'external'
    # Records the deployment target and scopes the ingest secret to production.
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # Pulling the collector image published by publish-images.yml.
      packages: read
    steps:
      # No checkout and no JDK: this runs the image rather than the sources, so
      # it scores exactly the artefact that was published for master.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the scoring collector
        shell: bash
        run: |
          date_arg="${{ github.event.inputs.date }}"
          args=()
          if [ -n "$date_arg" ]; then
            args+=("--date=$date_arg")
          fi
          # Docker refuses a repository name with an uppercase letter in it, and
          # the owner here is `FantasyWiki`. publish-images.yml never trips on
          # this because docker/metadata-action lowercases the name for you;
          # this step talks to the daemon directly, so it has to do it itself.
          owner="${{ github.repository_owner }}"
          image="ghcr.io/${owner,,}/scoring-collector:latest"
          # `-e NAME` with no value forwards this step's environment, which keeps
          # the ingest secret off a command line any process listing could read.
          docker run --rm \
            -e BACKEND_URL \
            -e SCORING_INGEST_SECRET \
            -e WIKIMEDIA_USER_AGENT \
            "$image" "${args[@]}"
        env:
          # Production backend Worker; the URL is public (see deploy-strategy.md).
          BACKEND_URL: https://backend.luca0patrignani.workers.dev
          SCORING_INGEST_SECRET: ${{ secrets.SCORING_INGEST_SECRET_PRODUCTION }}
          # Contact info Wikimedia requires (it 403s a request without a
          # descriptive UA); public, so inlined rather than a var.
          WIKIMEDIA_USER_AGENT: "FantasyWiki/1.0 (https://fantasywiki.pages.dev; luca0patrignani@gmail.com)"
